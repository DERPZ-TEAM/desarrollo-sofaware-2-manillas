{% extends 'account/base_gestion.html' %}
{% block title %}{{ titulo }}{% endblock %}

{% block content %}

<div class="row justify-content-center">
<div class="col-lg-6">

    <div class="card text-dark shadow">
        <div class="card-body p-4">

            <h1 class="h3 mb-3">{{ titulo }}</h1>

            <p class="mb-2">¿Seguro que quieres eliminar <strong>{{ nombre }}</strong>?</p>
            <p class="text-muted">{{ aviso }}</p>

            <form method="post" class="d-flex gap-2 mt-4">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Sí, eliminar</button>
                <a href="{% url volver %}" class="btn btn-outline-secondary">Cancelar</a>
            </form>

        </div>
    </div>

</div>
</div>

{% endblock %}
