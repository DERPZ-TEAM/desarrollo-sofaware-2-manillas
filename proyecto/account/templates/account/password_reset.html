<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">

    <title>Recuperar contraseña</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-dark">

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-4">

            <div class="card mt-5">

                <div class="card-body">

                    <h2 class="text-center mb-4">
                        Recuperar contraseña
                    </h2>

                    <form method="POST">

                        {% csrf_token %}

                        {{ form.as_p }}

                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                        >
                            Enviar correo
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
