<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">

    <title>Cambiar contraseña</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-dark">

<div class="container">

    <div class="row justify-content-center align-items-center vh-100">

        <div class="col-md-4">

            <div class="card shadow-lg border-0 rounded-4">

                <div class="card-body p-4">

                    <h2 class="text-center mb-4">
                        Nueva contraseña
                    </h2>

                    <form method="POST">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label class="form-label">
                                Nueva contraseña
                            </label>

                            {{ form.new_password1 }}

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                Confirmar contraseña
                            </label>

                            {{ form.new_password2 }}

                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                        >
                            Cambiar contraseña
                        </button>

                    </form>

                    {% if form.errors %}

                        <div class="alert alert-danger mt-3">

                            {{ form.errors }}

                        </div>

                    {% endif %}

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
