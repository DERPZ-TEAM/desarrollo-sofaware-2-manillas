<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">

    <title>Registro</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-dark">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-4">

                <div class="card mt-5 shadow">

                    <div class="card-body">

                        <h2 class="text-center mb-4">
                            Registro
                        </h2>

                        <form method="POST">

                            {% csrf_token %}

                            <div class="mb-3">

                                <input
                                    type="text"
                                    name="username"
                                    class="form-control"
                                    placeholder="Usuario"
                                >
                            

                            </div>

                            <div class="mb-3">
                                <input
                                    type="text"
                                    name="primer_nombre"
                                    class="form-control"
                                    placeholder="Primer nombre"
                                    required
                                > 
                            </div>  
                            <div class="mb-3">

                                <input
                                    type="text"
                                    name="segundo_nombre"
                                    class="form-control"
                                    placeholder="Segundo nombre (Opcional)"
                                >

                            </div>
                            <div class="mb-3">

                                <input
                                    type="text"
                                    name="apellidos"
                                    class="form-control"
                                    placeholder="Apellidos"
                                    required
                                >

                            </div>

                            <div class="mb-3">

                                <input
                                    type="email"
                                    name="email"
                                    class="form-control"
                                    placeholder="Correo"
                                >

                            </div>

                            <div class="mb-3">

                                <input
                                    type="password"
                                    name="password"
                                    class="form-control"
                                    placeholder="Contraseña"
                                >

                            </div>

                            <button
                                type="submit"
                                class="btn btn-success w-100"
                            >
                                Registrarse
                            </button>

                        </form>

                        <p class="text-danger mt-3">
                            {{ error }}
                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>
</html>
