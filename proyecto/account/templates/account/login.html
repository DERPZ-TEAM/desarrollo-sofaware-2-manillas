<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">

    <title>Login</title>
    
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-dark">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-4">

                <div class="card mt-5 shadow">

                    <div class="card-body">

                        <h2 class="text-center mb-4">
                            Iniciar Sesión

                        </h2>

                        <form method="POST">

                            {% csrf_token %}

                            <div class="mb-3">

                                <input
                                    type="text"
                                    name="username"
                                    class="form-control"
                                    placeholder="Usuario"
                                >

                            </div>

                            <div class="mb-3">

                                <input
                                    type="password"
                                    name="password"
                                    class="form-control"
                                    placeholder="Contraseña"
                                >

                            </div>

                            <button
                                type="submit"
                                class="btn btn-primary w-100"
                            >
                                Ingresar
                            </button>
                            <div class="text-center mt-3">

    <a href="/password_reset/">
        ¿Olvidaste tu contraseña?
    </a>

</div>

                        </form>

                        <p class="text-danger mt-3">
                            {{ error }}
                        </p>

                        <div class="text-center mt-3">

                            <a href="/registro/">
                                Registrarse

                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>
</html>
