<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">

    <title>Actualizar usuario</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-dark">

<div class="container">

    <div class="row justify-content-center align-items-center vh-100">

        <div class="col-md-4">

            <div class="card shadow-lg border-0 rounded-4">

                <div class="card-body p-4">

                    <h2 class="text-center mb-4">
                        Actualizar usuario
                    </h2>

                    <form method="POST">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label>
                                Usuario
                            </label>

                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                value="{{ usuario.username }}"
                            >

                        </div>

                        <div class="mb-4">

                            <label>
                                Correo
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                value="{{ usuario.email }}"
                            >

                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                        >
                            Actualizar
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
