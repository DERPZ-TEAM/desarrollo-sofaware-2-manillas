<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Gestión{% endblock %} · Gold Bracelets</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-dark text-white">

<nav class="navbar navbar-dark bg-black mb-4">
    <div class="container d-flex flex-wrap gap-2">

        <a class="navbar-brand" href="{% url 'inicio' %}">💎 Gold Bracelets</a>

        <div class="d-flex flex-wrap gap-2">
            <a href="{% url 'inicio' %}" class="btn btn-outline-light btn-sm">Tienda</a>
            <a href="{% url 'gestion_productos' %}" class="btn btn-outline-warning btn-sm">Productos</a>
            <a href="{% url 'gestion_categorias' %}" class="btn btn-outline-warning btn-sm">Categorías</a>
            <a href="/logout/" class="btn btn-danger btn-sm">Cerrar sesión</a>
        </div>

    </div>
</nav>

<div class="container pb-5">

    {% if messages %}
        {% for m in messages %}
        <div class="alert alert-{% if m.tags == 'error' %}danger{% else %}success{% endif %}">
            {{ m }}
        </div>
        {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}

</div>

</body>
</html>
